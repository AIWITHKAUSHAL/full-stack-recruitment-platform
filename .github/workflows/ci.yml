# =============================================================================
# Continuous integration
#
# Runs on every pull request and on pushes to main. It NEVER deploys — a pull
# request from a fork must not be able to reach AWS (that is why the OIDC trust
# policy in terraform/github_oidc.tf only accepts refs/heads/main).
#
# Four independent jobs so a failure points straight at the layer that broke.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Tests (pytest)
        # The suite runs against a throwaway SQLite database, so no service
        # containers are needed and CI stays fast.
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Verify the migration matches the models
        # Catches "changed a model, forgot the migration" before it reaches a
        # deployment, where the failure mode is a missing column at runtime.
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend — lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test:run

      - name: Build
        run: npm run build

  terraform:
    name: Terraform — format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        # -backend=false: validation needs no state and no AWS credentials.
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  docker:
    name: Docker — backend image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          # Repository root, because the image needs seed/jobs.json.
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mini-job-board-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Proves the image actually starts and serves /health, rather than only
        # that it compiled. No database is needed: /health is liveness only.
        run: |
          docker run -d --name mjb-ci -p 8000:8000 \
            -e ENVIRONMENT=local \
            -e DATABASE_URL="sqlite:///./ci.db" \
            mini-job-board-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "image serves /health"
              docker rm -f mjb-ci
              exit 0
            fi
            sleep 2
          done
          echo "image never became healthy"
          docker logs mjb-ci
          docker rm -f mjb-ci
          exit 1

  security:
    name: Security — no committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for committed credentials and sensitive files
        run: ./scripts/check-secrets.sh
